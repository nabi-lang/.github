# Lint, hermetic tests and manifest checks of the blocks. install-nabi also
# runs for real on the three smoke runners.
name: CI / Lint and test the shared blocks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    permissions:
      contents: read
    uses: $/.github/workflows/reusable-dco.yml

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12 and shfmt 3.14.1
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz -C bin actionlint
          curl -fsSL -o bin/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  bin/shfmt" | sha256sum -c -
          chmod +x bin/shfmt
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint workflows with actionlint
        run: actionlint -color
      - name: Check the action headers
        run: |
          # each action says what it takes, gives and needs
          bad=0
          for f in actions/*/action.yml; do
            for k in Inputs Outputs Permissions; do
              grep -q "^# $k:" "$f" || { echo "::error file=$f::no '# $k:' line in the header"; bad=1; }
            done
          done
          exit "$bad"
      - name: Lint scripts and action run blocks with shellcheck
        run: |
          set -eu
          shellcheck --version | sed -n 2p
          shellcheck -s sh lib/*.sh tests/*.sh tests/shim/*
          # the run: blocks of the composite actions
          mkdir -p "$RUNNER_TEMP/runs"
          for f in actions/*/action.yml; do
            a=$(basename "$(dirname "$f")")
            n=$(yq '[.runs.steps[] | select(has("run"))] | length' "$f")
            i=0
            while [ "$i" -lt "$n" ]; do
              { echo '#!/bin/bash'; yq "[.runs.steps[] | select(has(\"run\"))][$i].run" "$f"; } > "$RUNNER_TEMP/runs/$a-$i.sh"
              i=$((i + 1))
            done
          done
          shellcheck "$RUNNER_TEMP"/runs/*.sh
      - name: Check script format with shfmt
        run: shfmt -sr -d lib tests

  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  test:
    name: Test lib scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned minisign
        # the pinned one install-nabi uses; the tests verify real signatures
        run: |
          set -eu
          bin=$(sh lib/toolchain.sh minisign "$RUNNER_TEMP/minisign")
          dirname "$bin" >> "$GITHUB_PATH"
      - name: Run tests/run.sh
        run: tests/run.sh

  manifest:
    name: Check the release manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate pipeline.json against its schema
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q check-jsonschema==0.38.2
          "$RUNNER_TEMP/venv/bin/check-jsonschema" --check-metaschema release/pipeline.schema.json
          "$RUNNER_TEMP/venv/bin/check-jsonschema" --schemafile release/pipeline.schema.json release/pipeline.json
      - name: Cross-check pipeline.json against GitHub
        run: lib/manifest-check.sh --live release/pipeline.json
        env:
          GH_TOKEN: ${{ github.token }}

  install-nabi:
    name: Test install-nabi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nabi 0.1 with this checkout's install-nabi
        id: nabi
        uses: ./actions/install-nabi # zizmor: ignore[self-repository] tests this checkout
        with:
          version: "0.1"
      - name: Check that nabi runs
        shell: bash
        env:
          WANT: ${{ steps.nabi.outputs.version }}
        run: |
          set -eu
          nabi --version
          nabi --version | grep -q "^nabi $WANT "

  # The one required check (rulesets/main.json): passes when every job
  # passed or was skipped.
  ci-gate:
    name: CI gate
    needs: [dco, lint, zizmor, test, manifest, install-nabi]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *)
                echo "::error::a gate job did not pass: $r"
                exit 1
                ;;
            esac
          done
